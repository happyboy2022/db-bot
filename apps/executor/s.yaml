edition: 3.0.0
name: sql-ops-executor
access: aliyun

vars:
  region: ${env(ALIYUN_REGION, cn-shanghai)}

resources:
  executor:
    component: fc3
    props:
      region: ${vars.region}
      functionName: sql-ops-executor
      description: SQL Ops Executor Service
      runtime: custom.debian10
      handler: index.handler
      timeout: 60
      memorySize: 256
      cpu: 0.25
      diskSize: 512
      instanceConcurrency: 10
      environmentVariables:
        EXECUTOR_API_TOKEN: ${env(EXECUTOR_API_TOKEN)}
        SERVICE_DB_CONFIG_JSON: ${env(SERVICE_DB_CONFIG_JSON)}
      code: ./dist
      customRuntimeConfig:
        command:
          - node
          - index.js
